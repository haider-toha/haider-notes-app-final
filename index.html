
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Haider Notes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              apple: {
                yellow: '#F0C000',
                yellowDark: '#FFD60A',
                sidebarLight: '#F2F2F7', 
                sidebarDark: '#1C1C1E',
                bgLight: '#FFFFFF',
                bgDark: '#000000',
                separatorLight: '#C6C6C8',
                separatorDark: '#38383A',
                textGray: '#8E8E93',
                textDark: '#FFFFFF',
                searchLight: '#E3E3E8',
                searchDark: '#2C2C2E',
                selectionLight: '#E0B039',
                selectionDark: '#DCA226',
                hoverLight: 'rgba(0,0,0,0.05)',
                hoverDark: 'rgba(255,255,255,0.1)',
              }
            },
            fontFamily: {
              sans: [
                '"SF Pro Text"',
                '"SF Pro Display"',
                '"SF Pro Icons"',
                '-apple-system',
                'BlinkMacSystemFont',
                'system-ui',
                '"San Francisco"',
                '"Helvetica Neue"',
                '"Segoe UI"',
                'Roboto',
                'Helvetica',
                'Arial',
                'sans-serif',
              ],
            },
          },
        },
      };
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none; /* Prevent bounce on mobile */
      }
      html, body {
        height: 100%;
      }
      /* Slightly more "native" focus ring behavior */
      :focus-visible {
        outline: 2px solid rgba(240, 192, 0, 0.55);
        outline-offset: 2px;
        border-radius: 10px;
      }
      /* Custom selection color */
      ::selection {
        background-color: #E0B039; /* Apple Yellow */
        color: white;
      }

      /*
        Font notes:
        - On macOS/iOS: SF Pro is used automatically via -apple-system.
        - On Windows: if you install SF Pro (or another SF-like font) locally, the "SF Pro Text/Display"
          entries below will be picked up by the browser automatically.
      */
      @font-face {
        font-family: "SF Pro Text";
        src: local("SF Pro Text"), local("SF Pro Display");
        font-style: normal;
        font-weight: 100 900;
      }
    </style>
</head>
  <body class="bg-apple-bgLight dark:bg-apple-bgDark text-black dark:text-white h-screen overflow-hidden selection:bg-apple-yellow selection:text-white">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
