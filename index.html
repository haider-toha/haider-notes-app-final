
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Haider Toha</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              apple: {
                yellow: '#FFCC00',
                yellowDark: '#FFD60A',
                selectionLight: '#FFD52E',
                selectionDark: '#E0A93A',
                sidebarLight: '#F4F4F6',
                sidebarDark: '#1C1C1E',
                bgLight: '#FFFFFF',
                bgDark: '#000000',
                editorDark: '#1C1C1E',
                separatorLight: '#D6D6DA',
                separatorDark: '#38383A',
                textGray: '#8E8E93',
                textDark: '#FFFFFF',
                searchLight: '#E4E4E9',
                searchDark: '#2C2C2E',
                hoverLight: 'rgba(0,0,0,0.045)',
                hoverDark: 'rgba(255,255,255,0.06)',
              }
            },
            fontFamily: {
              sans: [
                '"SF Pro Text"',
                '"SF Pro Display"',
                '"SF Pro Icons"',
                '-apple-system',
                'BlinkMacSystemFont',
                'system-ui',
                '"San Francisco"',
                '"Helvetica Neue"',
                '"Segoe UI"',
                'Roboto',
                'Helvetica',
                'Arial',
                'sans-serif',
              ],
            },
          },
        },
      };
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none; /* Prevent bounce on mobile */
      }
      html, body {
        height: 100vh;  /* fallback for browsers without dvh support */
        height: 100dvh; /* dynamic viewport height so mobile browser chrome doesn't clip the bottom of the content */
      }
      /* Slightly more "native" focus ring behavior */
      :focus-visible {
        outline: 2px solid rgba(255, 212, 38, 0.6);
        outline-offset: 2px;
        border-radius: 8px;
      }
      /* Apple Notes text-selection: a translucent yellow highlight that keeps the
         underlying text color (matches the macOS/iOS yellow accent highlight). */
      ::selection {
        background-color: rgba(255, 212, 38, 0.38);
      }

      /*
        Font notes:
        - On macOS/iOS: SF Pro is used automatically via -apple-system.
        - On Windows: if you install SF Pro (or another SF-like font) locally, the "SF Pro Text/Display"
          entries below will be picked up by the browser automatically.
      */
      @font-face {
        font-family: "SF Pro Text";
        src: local("SF Pro Text"), local("SF Pro Display");
        font-style: normal;
        font-weight: 100 900;
      }
    </style>
</head>
  <body class="bg-apple-bgLight dark:bg-apple-bgDark text-black dark:text-white overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
