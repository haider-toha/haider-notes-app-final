
<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Per-page <title>, description, canonical, Open Graph, Twitter and page-level
         JSON-LD are injected at build time by scripts/prerender.mjs (and kept in sync
         on client-side notebook navigation by App.tsx). The tags below are the site-wide
         constants that are identical on every page. -->
    <title>Haider Toha</title>
    <meta name="author" content="Haider Toha" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta property="og:site_name" content="Haider Toha" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@HaiderToha" />
    <meta name="twitter:creator" content="@HaiderToha" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="mask-icon" href="/favicon.svg" color="#F0C000" />
    <!-- rel="me" ties this domain to the same identity across platforms. -->
    <link rel="me" href="https://www.linkedin.com/in/haidertoha" />
    <link rel="me" href="https://github.com/haider-toha" />
    <link rel="me" href="https://x.com/HaiderToha" />

    <link rel="preload" href="/fonts/reenie.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Prerendered SEO content (see #ssg-root in <body>) is real HTML that non-JS
         crawlers/recruiter tools read directly. As soon as JS is available we hide it
         so it never flashes before React mounts the actual app in the same #root. */
      html.js #ssg-root { display: none !important; }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none; /* Prevent bounce on mobile */
      }
      html, body {
        height: 100vh;  /* fallback for browsers without dvh support */
        height: 100dvh; /* dynamic viewport height so mobile browser chrome doesn't clip the bottom of the content */
      }
      /* Slightly more "native" focus ring behavior */
      :focus-visible {
        outline: 2px solid #536b87;
        outline-offset: 2px;
        border-radius: 8px;
      }
      /* Ink-toned selection stays legible on the notebook paper. */
      ::selection {
        background-color: rgba(83, 107, 135, 0.2);
      }

    </style>
    <!--SSG-HEAD-->
</head>
  <body class="bg-white text-[#303f53] overflow-hidden">
    <!-- Progressive enhancement: flag JS availability before first paint so the
         prerendered #ssg-root (below) is hidden instantly for real browsers while
         staying fully readable to non-JS crawlers and recruiter/ATS scrapers. -->
    <script>document.documentElement.classList.add('js');</script>
    <div id="root" class="h-full w-full"><!--SSG-BODY--></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
