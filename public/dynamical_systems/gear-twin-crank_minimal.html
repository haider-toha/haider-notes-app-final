<!DOCTYPE html>

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:Georgia,"Times New Roman",serif;}
  .wrap{max-width:720px;margin:0 auto;padding:12px 12px 18px;}
  #scene{width:100%;height:auto;display:block;background:#fffefb;border-radius:6px;}
  .bar{display:flex;justify-content:center;margin-top:12px;}
  #playpause{
    font-family:inherit;font-size:14px;cursor:pointer;
    background:#1c1b18;color:#f7f4ec;border:none;border-radius:7px;
    padding:8px 20px;letter-spacing:.3px;min-width:96px;
  }
  #playpause:active{transform:translateY(1px);}

</head>

<div class="wrap">
  <canvas id="scene" width="1880" height="1320"></canvas>

    <button id="playpause">Pause</button>
  </div>
</div>

<script>
/* ============================================================================
   GEAR-CLOSED TWIN-CRANK LOOP WITH PENDULUM TRAINS
   --------------------------------------------------------------------------
   q = (theta1, phi_a, phi_b, phi_c).   Gear closure  R1*theta1 = -R2*theta2
   folds theta2 = -rho*theta1  (rho = R1/R2)  into the coordinates.

   Chain 1 (pivot O1): crank arm1 (m1,L1, absolute angle theta1) -> double
   pendulum penda (ma,a,phi_a) -> pendb (mb,b,phi_b).
   Chain 2 (pivot O2): crank arm2 (m2,L2, theta2=-rho*theta1) -> single
   pendulum pendc (mc,c,phi_c).   All five bodies are uniform rods, I=m L^2/12.

   Canonical form  M(q) qdd = F(q,qd)  (symmetric M = d2L/dqd dqd), integrated
   with classical fixed-step RK4.  E = T + V is computed INDEPENDENTLY from the
   Cartesian rigid-body kinematics (not reconstructed from M/F), so its flatness
   is a real check.  These M / F / energy match the verified energy-oracle run
   bit-for-bit (E0 = 5.180044 J, maxRelDrift ~2.8e-7 over 40 s at dt = 1e-3).
   ========================================================================== */

/* ---------- parameters, initial conditions & state ---------- */
const PAR = { m1:1.0, L1:1.0, m2:1.2, L2:0.9, ma:0.5, a:0.6, mb:0.4, b:0.5,
              mc:0.6, c:0.7, R1:0.3, R2:0.5, g:9.81 };
const IC  = { th1:17, pa:29, pb:-23, pc:40,          // release angles (degrees)
              th1d:0.6, pad:-0.9, pbd:1.1, pcd:-0.7 };// release speeds (rad/s)

// state = [theta1, phi_a, phi_b, phi_c, theta1_d, phi_a_d, phi_b_d, phi_c_d]
let S  = [0.30, 0.51, -0.40, 0.70, 0.6, -0.9, 1.1, -0.7];
let E0 = 0;            // energy baseline (re-set on reset / param change)
let simT = 0;
let lastSample = 0;
let running = true;
let blewUp = false;    // set only if the state runs non-finite (safety guard)

const DT = 0.001;      // fixed integrator step (s) -- the dt that passed the oracle
const SUBSTEPS = 16;   // -> 16 ms of sim per animation frame
const DEG = Math.PI/180;
const cos = Math.cos, sin = Math.sin;

/* ---------- dynamics:  M(q) qdd = F(q,qd)  (verbatim canonical strings) ----------
   Symbols:  q = (theta1, phi_a, phi_b, phi_c),  u = their time-derivatives.
   Transcribed exactly from derivations/gear-closed-twin-crank-pendulums.md §8. */
function buildMF(q, u){
  const theta1=q[0], phi_a=q[1], phi_b=q[2], phi_c=q[3];
  const theta1_d=u[0], phi_a_d=u[1], phi_b_d=u[2], phi_c_d=u[3];
  const m1=PAR.m1, L1=PAR.L1, m2=PAR.m2, L2=PAR.L2, ma=PAR.ma, a=PAR.a,
        mb=PAR.mb, b=PAR.b, mc=PAR.mc, c=PAR.c, R1=PAR.R1, R2=PAR.R2, g=PAR.g;

  const M00 = (L1**2*R2**2*(m1 + 3*ma + 3*mb) + L2**2*R1**2*m2 + 3*L2**2*R1**2*mc)/(3*R2**2);
  const M01 = L1*a*(ma + 2*mb)*cos(phi_a - theta1)/2;
  const M02 = L1*b*mb*cos(phi_b - theta1)/2;
  const M03 = -L2*R1*c*mc*cos(R1*theta1/R2 + phi_c)/(2*R2);
  const M11 = a**2*(ma/3 + mb);
  const M12 = a*b*mb*cos(phi_a - phi_b)/2;
  const M22 = b**2*mb/3;
  const M33 = c**2*mc/3;

  const M = [
    [M00, M01, M02, M03],
    [M01, M11, M12, 0  ],
    [M02, M12, M22, 0  ],
    [M03, 0,   0,   M33],
  ];

  const F = [
    (L1*R2*(a*ma*phi_a_d**2*sin(phi_a - theta1) + 2*a*mb*phi_a_d**2*sin(phi_a - theta1) + b*mb*phi_b_d**2*sin(phi_b - theta1) - g*m1*cos(theta1) - 2*g*ma*cos(theta1) - 2*g*mb*cos(theta1)) - L2*R1*c*mc*phi_c_d**2*sin(R1*theta1/R2 + phi_c) + L2*R1*g*m2*cos(R1*theta1/R2) + 2*L2*R1*g*mc*cos(R1*theta1/R2))/(2*R2),
    -a*(L1*ma*theta1_d**2*sin(phi_a - theta1) + 2*L1*mb*theta1_d**2*sin(phi_a - theta1) + b*mb*phi_b_d**2*sin(phi_a - phi_b) + g*ma*cos(phi_a) + 2*g*mb*cos(phi_a))/2,
    b*mb*(-L1*theta1_d**2*sin(phi_b - theta1) + a*phi_a_d**2*sin(phi_a - phi_b) - g*cos(phi_b))/2,
    -c*mc*(L2*R1**2*theta1_d**2*sin(R1*theta1/R2 + phi_c) + R2**2*g*cos(phi_c))/(2*R2**2),
  ];
  return { M, F };
}

// Gaussian elimination with partial pivoting: solve A x = b  (n x n)
function solveLin(A, b, n){
  const M=A.map((row,i)=>row.slice().concat(b[i]));
  for(let col=0; col<n; col++){
    let piv=col;
    for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    const t=M[col]; M[col]=M[piv]; M[piv]=t;
    const dg=M[col][col];
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=M[r][col]/dg;
      if(f!==0) for(let cc=col;cc<=n;cc++) M[r][cc]-=f*M[col][cc];
    }
  }
  const x=new Array(n);
  for(let i=0;i<n;i++) x[i]=M[i][n]/M[i][i];
  return x;
}

function deriv(st){
  const q=[st[0],st[1],st[2],st[3]], u=[st[4],st[5],st[6],st[7]];
  const { M, F } = buildMF(q,u);
  const acc = solveLin(M, F, 4);
  return [u[0],u[1],u[2],u[3], acc[0],acc[1],acc[2],acc[3]];
}
function rk4(st,h){
  const add=(a,k,f)=>{const o=new Array(8);for(let i=0;i<8;i++)o[i]=a[i]+f*k[i];return o;};
  const k1=deriv(st), k2=deriv(add(st,k1,h/2)), k3=deriv(add(st,k2,h/2)), k4=deriv(add(st,k3,h));
  const o=new Array(8);
  for(let i=0;i<8;i++) o[i]=st[i]+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
  return o;
}

/* ---------- conserved quantities (INDEPENDENT of M / F) ----------
   Cartesian rigid-body energy of the 5 rods; gear closure theta2 = -rho*theta1.
   dir(psi) = (cos psi, sin psi); velocities are analytic Jacobians of the map. */
function energy(){
  const th1=S[0], pa=S[1], pb=S[2], pc=S[3];
  const th1d=S[4], pad=S[5], pbd=S[6], pcd=S[7];
  const m1=PAR.m1, L1=PAR.L1, m2=PAR.m2, L2=PAR.L2, ma=PAR.ma, a=PAR.a,
        mb=PAR.mb, b=PAR.b, mc=PAR.mc, c=PAR.c, R1=PAR.R1, R2=PAR.R2, g=PAR.g;
  const rho = R1/R2, th2 = -rho*th1, th2d = -rho*th1d;
  const I1=m1*L1*L1/12, Ia=ma*a*a/12, Ib=mb*b*b/12, I2=m2*L2*L2/12, Ic=mc*c*c/12;

  // mass-centre velocities (world frame, y up)
  const vG1x = -(L1/2)*sin(th1)*th1d,               vG1y =  (L1/2)*cos(th1)*th1d;
  const vGax = -L1*sin(th1)*th1d - (a/2)*sin(pa)*pad, vGay =  L1*cos(th1)*th1d + (a/2)*cos(pa)*pad;
  const vGbx = -L1*sin(th1)*th1d - a*sin(pa)*pad - (b/2)*sin(pb)*pbd,
        vGby =  L1*cos(th1)*th1d + a*cos(pa)*pad + (b/2)*cos(pb)*pbd;
  const vG2x = -(L2/2)*sin(th2)*th2d,               vG2y =  (L2/2)*cos(th2)*th2d;
  const vGcx = -L2*sin(th2)*th2d - (c/2)*sin(pc)*pcd, vGcy =  L2*cos(th2)*th2d + (c/2)*cos(pc)*pcd;

  const T =
      0.5*m1*(vG1x*vG1x+vG1y*vG1y) + 0.5*I1*th1d*th1d
    + 0.5*ma*(vGax*vGax+vGay*vGay) + 0.5*Ia*pad*pad
    + 0.5*mb*(vGbx*vGbx+vGby*vGby) + 0.5*Ib*pbd*pbd
    + 0.5*m2*(vG2x*vG2x+vG2y*vG2y) + 0.5*I2*th2d*th2d
    + 0.5*mc*(vGcx*vGcx+vGcy*vGcy) + 0.5*Ic*pcd*pcd;

  const yG1 = (L1/2)*sin(th1);
  const yGa = L1*sin(th1) + (a/2)*sin(pa);
  const yGb = L1*sin(th1) + a*sin(pa) + (b/2)*sin(pb);
  const yG2 = (L2/2)*sin(th2);
  const yGc = L2*sin(th2) + (c/2)*sin(pc);
  const V = g*(m1*yG1 + ma*yGa + mb*yGb + m2*yG2 + mc*yGc);
  return { T, V, E:T+V };
}
// gear-mesh closure residual: R1*theta1 + R2*theta2, with theta2 = -(R1/R2)*theta1  ->  0
function gearResidual(){ return PAR.R1*S[0] + PAR.R2*(-(PAR.R1/PAR.R2)*S[0]); }

/* ---------- reset / re-baseline ---------- */
function resetState(){
  S = [IC.th1*DEG, IC.pa*DEG, IC.pb*DEG, IC.pc*DEG, IC.th1d, IC.pad, IC.pbd, IC.pcd];
  simT=0; lastSample=0; blewUp=false;
  E0 = energy().E;
  eHist.length = 0;
}
function rebaseline(){          // keep motion, re-zero the energy reference
  E0 = energy().E;
  eHist.length = 0;
}

/* ============================================================================
   RENDERING  (textbook line-drawing aesthetic)
   ========================================================================== */
const cv  = document.getElementById('scene');
const ctx = cv.getContext('2d');
const CW = 940, CH = 660;        // CSS logical size
(function setupHiDPI(){
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
  cv.width = CW*dpr; cv.height = CH*dpr;
  cv.style.aspectRatio = CW+'/'+CH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
})();

const INK='#1c1b18', INKSOFT='#6a655c', FILL='#cdc6b6', FILL2='#e3ddcf',
      ROD2='#3a3730', GEARFILL='#efe9dd', MARK='#a8324a';

function serif(size, italic){ return (italic?'italic ':'')+size+'px Georgia, serif'; }
function lab(txt,x,y,opt={}){
  ctx.save();
  ctx.fillStyle = opt.color||INK;
  ctx.font = serif(opt.size||15, opt.italic!==false);
  ctx.textAlign = opt.align||'center';
  ctx.textBaseline = opt.baseline||'middle';
  ctx.fillText(txt,x,y);
  ctx.restore();
}
function arrow(x1,y1,x2,y2,opt={}){
  const head = opt.head||8;
  ctx.save();
  ctx.strokeStyle = opt.color||INK; ctx.fillStyle = opt.color||INK;
  ctx.lineWidth = opt.w||1.4;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a = Math.atan2(y2-y1, x2-x1);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.4), y2-head*Math.sin(a-0.4));
  ctx.lineTo(x2-head*Math.cos(a+0.4), y2-head*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
// hatched fixed-support glyph below a grounded pivot
function groundGlyph(sx,sy,halfw,drop){
  ctx.save(); ctx.strokeStyle=INKSOFT; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx,sy+drop); ctx.stroke();     // stub
  const y=sy+drop;
  ctx.beginPath(); ctx.moveTo(sx-halfw,y); ctx.lineTo(sx+halfw,y); ctx.stroke();// bar
  const step=9, h=8;
  ctx.beginPath();
  for(let x=sx-halfw; x<=sx+halfw; x+=step){ ctx.moveTo(x,y); ctx.lineTo(x-h,y+h); }
  ctx.stroke();
  ctx.restore();
}
function dot(x,y,r,c){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI); ctx.fillStyle=c; ctx.fill(); ctx.restore(); }
function ring(x,y,r){ ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.fillStyle='#fffefb';
  ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*0.4,0,2*Math.PI); ctx.stroke(); ctx.restore(); }
function dimLine(x1,y1,x2,y2,txt,off){
  const a=Math.atan2(y2-y1,x2-x1), nx=Math.cos(a+Math.PI/2), ny=Math.sin(a+Math.PI/2);
  const ox=nx*off, oy=ny*off;
  ctx.save(); ctx.strokeStyle=INKSOFT; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x1+ox,y1+oy); ctx.lineTo(x2+ox,y2+oy); ctx.stroke();
  arrow(x1+ox,y1+oy,x2+ox,y2+oy,{w:1,head:5,color:INKSOFT});
  lab(txt,(x1+x2)/2+ox*1.7,(y1+y2)/2+oy*1.7,{size:13,color:INKSOFT});
  ctx.restore();
}

// current world->screen transform (recomputed per frame from PARAMS only, no jitter)
let TX = { scale:100, cx:CW/2, cy:CH/2 };
function W2S(wx,wy){ return [TX.cx + wx*TX.scale, TX.cy - wy*TX.scale]; }
// screen point at world-angle phi, radius rpx, about screen centre (cx,cy)
function spt(cxs,cys,rpx,phi){ return [cxs + rpx*Math.cos(phi), cys - rpx*Math.sin(phi)]; }

// absolute-angle arc from the horizontal to angle psi (world CCW+), about (sx,sy)
function angleArcAbs(sx,sy,psi,txt,r){
  ctx.save(); ctx.strokeStyle=INKSOFT; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+r+14,sy); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.arc(sx,sy,r, Math.min(0,-psi), Math.max(0,-psi)); ctx.stroke(); ctx.restore();
  lab(txt, sx+(r+13)*Math.cos(psi/2), sy-(r+13)*Math.sin(psi/2), {size:14});
}

// one spur gear: pitch disc + teeth + 3 spokes + hub, all rotated by gear angle `ang`
function drawGear(cxs,cys,Rpx,ang){
  const nteeth = Math.max(6, Math.round(PAR.R1===PAR.R2 ? 12 : (Rpx/TX.scale)*24));
  ctx.save();
  // pitch disc
  ctx.beginPath(); ctx.arc(cxs,cys,Rpx,0,2*Math.PI);
  ctx.fillStyle=GEARFILL; ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=1.6; ctx.stroke();
  // teeth (short radial ticks straddling the pitch circle)
  ctx.strokeStyle=INK; ctx.lineWidth=1.3;
  for(let i=0;i<nteeth;i++){
    const ph = ang + i*2*Math.PI/nteeth;
    const p0 = spt(cxs,cys,Rpx-3,ph), p1 = spt(cxs,cys,Rpx+5,ph);
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  }
  // 3 spokes (one keyed to the crank direction)
  ctx.strokeStyle=INKSOFT; ctx.lineWidth=2;
  for(let k=0;k<3;k++){
    const ph = ang + k*2*Math.PI/3;
    const p1 = spt(cxs,cys,Rpx*0.86,ph);
    ctx.beginPath(); ctx.moveTo(cxs,cys); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  }
  // hub
  ctx.beginPath(); ctx.arc(cxs,cys,Math.min(9,Rpx*0.28),0,2*Math.PI);
  ctx.fillStyle=FILL2; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,CW,CH);

  const th1=S[0], pa=S[1], pb=S[2], pc=S[3];
  const R1=PAR.R1, R2=PAR.R2, L1=PAR.L1, L2=PAR.L2, a=PAR.a, b=PAR.b, c=PAR.c;
  const rho=R1/R2, th2=-rho*th1;

  // ---- parameter-based world layout & scale (constant during a run, no jitter) ----
  const D = R1 + R2;                         // gear centre distance
  const O1w=[-D/2, 0], O2w=[ D/2, 0];
  const reach1 = L1 + a + b, reach2 = L2 + c;
  const minX = Math.min(O1w[0]-reach1, O2w[0]-reach2, O1w[0]-R1);
  const maxX = Math.max(O1w[0]+reach1, O2w[0]+reach2, O2w[0]+R2);
  const maxY = Math.max(reach1, reach2, R1, R2);
  const bw = maxX-minX, bh = 2*maxY, pad = 54;
  TX.scale = Math.min((CW-2*pad)/bw, (CH-2*pad)/bh);
  const worldCx = (minX+maxX)/2;
  TX.cx = CW/2 - worldCx*TX.scale;
  TX.cy = CH/2;                               // world y-centre is 0

  // world points
  const A1w=[O1w[0]+L1*cos(th1), O1w[1]+L1*sin(th1)];
  const A2w=[A1w[0]+a*cos(pa),   A1w[1]+a*sin(pa)];
  const Bew=[A2w[0]+b*cos(pb),   A2w[1]+b*sin(pb)];   // pendb far tip
  const B1w=[O2w[0]+L2*cos(th2), O2w[1]+L2*sin(th2)];
  const Cew=[B1w[0]+c*cos(pc),   B1w[1]+c*sin(pc)];   // pendc far tip
  // screen points
  const O1=W2S(O1w[0],O1w[1]), O2=W2S(O2w[0],O2w[1]);
  const A1=W2S(A1w[0],A1w[1]), A2=W2S(A2w[0],A2w[1]), Be=W2S(Bew[0],Bew[1]);
  const B1=W2S(B1w[0],B1w[1]), Ce=W2S(Cew[0],Cew[1]);
  const R1px=R1*TX.scale, R2px=R2*TX.scale;

  // ---- gravity arrow (top-right) ----
  arrow(CW-46, 24, CW-46, 62, {w:1.6, head:8});
  lab('g', CW-33, 43, {size:16});

  // ---- fixed world reference frame (bottom-left) ----
  const ox=64, oy=CH-40;
  arrow(ox,oy, ox+34,oy,{w:1.2,head:6,color:INKSOFT});
  arrow(ox,oy, ox,oy-34,{w:1.2,head:6,color:INKSOFT});
  lab('n̂1', ox+44, oy,{size:12,color:INKSOFT});
  lab('n̂2', ox, oy-46,{size:12,color:INKSOFT});

  // ---- grounded pivots (hatched supports, behind the gears) ----
  groundGlyph(O1[0], O1[1]+R1px, 22, 12);
  groundGlyph(O2[0], O2[1]+R2px, 22, 12);

  // ---- meshing spur gears (crank keyed to each gear angle) ----
  drawGear(O1[0],O1[1], R1px, th1);
  drawGear(O2[0],O2[1], R2px, th2);
  // pitch/contact point on the O1-O2 line
  const contactW=[O1w[0]+R1, 0], Cn=W2S(contactW[0],contactW[1]);
  ctx.save(); ctx.fillStyle=MARK;
  ctx.beginPath();
  ctx.moveTo(Cn[0],Cn[1]-4); ctx.lineTo(Cn[0]+4,Cn[1]); ctx.lineTo(Cn[0],Cn[1]+4); ctx.lineTo(Cn[0]-4,Cn[1]);
  ctx.closePath(); ctx.fill(); ctx.restore();
  // gear radius dimension lines (pointing up, clear of the ground glyphs)
  const r1tip=spt(O1[0],O1[1],R1px,Math.PI/2), r2tip=spt(O2[0],O2[1],R2px,Math.PI/2);
  arrow(O1[0],O1[1], r1tip[0],r1tip[1], {w:1,head:5,color:INKSOFT});
  arrow(O2[0],O2[1], r2tip[0],r2tip[1], {w:1,head:5,color:INKSOFT});
  lab('R₁', O1[0]-12, O1[1]-R1px*0.55, {size:12,color:INKSOFT});
  lab('R₂', O2[0]-12, O2[1]-R2px*0.55, {size:12,color:INKSOFT});

  // ---- cranks (thick rods) ----
  ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=INK; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(O1[0],O1[1]); ctx.lineTo(A1[0],A1[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(O2[0],O2[1]); ctx.lineTo(B1[0],B1[1]); ctx.stroke();
  ctx.restore();

  // ---- pendulum trains ----
  ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=ROD2; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.moveTo(A1[0],A1[1]); ctx.lineTo(A2[0],A2[1]); ctx.stroke(); // penda
  ctx.beginPath(); ctx.moveTo(A2[0],A2[1]); ctx.lineTo(Be[0],Be[1]); ctx.stroke(); // pendb
  ctx.beginPath(); ctx.moveTo(B1[0],B1[1]); ctx.lineTo(Ce[0],Ce[1]); ctx.stroke(); // pendc
  ctx.restore();

  // ---- crank absolute-angle arcs (show the counter-rotating gear coupling) ----
  angleArcAbs(O1[0],O1[1], th1, 'θ₁', Math.max(30, R1px*0.75));
  angleArcAbs(O2[0],O2[1], th2, 'θ₂', Math.max(30, R2px*0.75));

  // ---- length dimension lines + pendulum coordinate labels ----
  dimLine(O1[0],O1[1], A1[0],A1[1], 'L₁', -15);
  dimLine(O2[0],O2[1], B1[0],B1[1], 'L₂',  15);
  dimLine(A1[0],A1[1], A2[0],A2[1], 'a', 13);
  dimLine(A2[0],A2[1], Be[0],Be[1], 'b', 13);
  dimLine(B1[0],B1[1], Ce[0],Ce[1], 'c', 13);
  lab('φₐ', (A1[0]+A2[0])/2 - 14, (A1[1]+A2[1])/2 - 12, {size:13,color:MARK});
  lab('φ_b', (A2[0]+Be[0])/2 - 14, (A2[1]+Be[1])/2 - 12, {size:13,color:MARK});
  lab('φ_c', (B1[0]+Ce[0])/2 + 14, (B1[1]+Ce[1])/2 - 12, {size:13,color:MARK});

  // ---- pin joints (concentric circles) ----
  ring(A1[0],A1[1],5.5); ring(A2[0],A2[1],5.0); ring(B1[0],B1[1],5.5);
  ring(O1[0],O1[1],4.6); ring(O2[0],O2[1],4.6);
  // pendulum tip dots
  dot(Be[0],Be[1],4.5,MARK); dot(Ce[0],Ce[1],4.5,MARK);
  // pivot labels
  lab('O₁', O1[0]-R1px-4, O1[1]+R1px+2, {size:12,color:INKSOFT,align:'right'});
  lab('O₂', O2[0]+R2px+6, O2[1]+R2px+2, {size:12,color:INKSOFT,align:'left'});

  // ---- on-canvas live readout (top-left) ----
  const en = energy();
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='13px Menlo, monospace'; ctx.fillStyle=INKSOFT;
  ctx.fillText('E   = '+en.E.toFixed(4)+' J', 16, 14);
  ctx.fillText('ΔE  = '+fmtSci(en.E-E0)+' J', 16, 32);
  ctx.fillText('ρ = R₁/R₂ = '+rho.toFixed(3), 16, 50);
  ctx.fillText('θ₂ = -ρθ₁ = '+th2.toFixed(3)+' rad', 16, 68);
  ctx.restore();

  if(blewUp){
    ctx.save(); ctx.textAlign='center'; ctx.fillStyle=MARK;
    ctx.font=serif(17,true);
    ctx.fillText('state diverged — press Reset', CW/2, CH-16);
    ctx.restore();
  }
}

function fmtSci(v){
  if(v===0) return '0';
  const s = v<0?'-':'+'; v=Math.abs(v);
  return s+v.toExponential(2);
}

/* ============================================================================
   ENERGY STRIP CHART
   ========================================================================== */
const ech = document.getElementById('echart');
const ectx= ech.getContext('2d');
const ECW=380, ECH=150;
(function(){
  const dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  ech.width=ECW*dpr; ech.height=ECH*dpr; ech.style.aspectRatio=ECW+'/'+ECH;
  ectx.setTransform(dpr,0,0,dpr,0,0);
})();
const eHist=[];               // {t,T,V,E}
const HIST_MAX=600;           // ~ last 18 s (sampled every 0.03 s)

function pushHist(){
  const e=energy();
  eHist.push({t:simT, T:e.T, V:e.V, E:e.E});
  if(eHist.length>HIST_MAX) eHist.shift();
}
function drawChart(){
  ectx.clearRect(0,0,ECW,ECH);
  ectx.fillStyle='#fffefb'; ectx.fillRect(0,0,ECW,ECH);
  if(eHist.length<2) return;
  let lo=Infinity, hi=-Infinity;
  for(const s of eHist){ lo=Math.min(lo,s.T,s.V,s.E); hi=Math.max(hi,s.T,s.V,s.E); }
  if(hi-lo<1e-9){ hi+=0.5; lo-=0.5; }
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const t0=eHist[0].t, t1=eHist[eHist.length-1].t, span=Math.max(1e-6,t1-t0);
  const X=t=>8+(t-t0)/span*(ECW-16);
  const Y=v=>ECH-20-(v-lo)/(hi-lo)*(ECH-32);

  if(lo<0&&hi>0){ ectx.strokeStyle='#e7e1d3'; ectx.lineWidth=1;
    ectx.beginPath(); ectx.moveTo(8,Y(0)); ectx.lineTo(ECW-8,Y(0)); ectx.stroke(); }

  const series=[['V','#b9722a',1.4],['T','#2a7f6f',1.4],['E','#1c1b18',2.2]];
  for(const [key,col,w] of series){
    ectx.strokeStyle=col; ectx.lineWidth=w; ectx.beginPath();
    eHist.forEach((s,i)=>{ const x=X(s.t),y=Y(s[key]); i?ectx.lineTo(x,y):ectx.moveTo(x,y); });
    ectx.stroke();
  }
  ectx.fillStyle='#6a655c'; ectx.font='10px Menlo, monospace';
  ectx.textAlign='right'; ectx.fillText(hi.toFixed(2), ECW-4, 11);
  ectx.fillText(lo.toFixed(2), ECW-4, ECH-4);
  ectx.textAlign='left'; ectx.fillText('t (s)', 8, ECH-4);
}

const $=id=>document.getElementById(id);
function updateReadout(){
  const e=energy();
  $('rE').textContent   = e.E.toFixed(5)+' J';
  $('rdE').textContent  = fmtSci(e.E-E0)+' J';
  $('rK').textContent   = e.T.toFixed(5)+' J';
  $('rV').textContent   = e.V.toFixed(5)+' J';
  $('rgear').textContent= gearResidual().toExponential(1);
  $('rt').textContent   = simT.toFixed(2)+' s';
}

/* ============================================================================
   MAIN LOOP
   ========================================================================== */
function frame(){
  if(running && !blewUp){
    for(let i=0;i<SUBSTEPS;i++){
      const ns=rk4(S, DT);
      let ok=true; for(let j=0;j<8;j++) if(!Number.isFinite(ns[j])) ok=false;
      if(!ok){ blewUp=true; running=false; $('btnPlay').textContent='Play'; break; }
      S=ns; simT+=DT;
    }
    if(simT-lastSample>=0.03){ pushHist(); lastSample=simT; }
  }
  draw(); drawChart(); updateReadout();
  requestAnimationFrame(frame);
}

  sl.addEventListener('input', ()=>{
    obj[key]=parseFloat(sl.value); show();
    if(mode==='reset') resetState(); else rebaseline();
  });
  show();
}

/* ============================================================================
   TYPESET THE EQUATIONS WITH KaTeX
   --------------------------------------------------------------------------
   LAG_TEX and EOM_TEX are the verified derivation's LaTeX, embedded verbatim.
   ========================================================================== */
const LAG_TEX = "L = \\frac{L_{1} \\dot{\\phi}_a \\dot{\\theta}_1 a \\left(m_{a} + 2 m_{b}\\right) \\cos{\\left(\\phi_{a} - \\theta_{1} \\right)}}{2} + \\frac{L_{1} \\dot{\\phi}_b \\dot{\\theta}_1 b m_{b} \\cos{\\left(\\phi_{b} - \\theta_{1} \\right)}}{2} - \\frac{L_{2} R_{1} \\dot{\\phi}_c \\dot{\\theta}_1 c m_{c} \\cos{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} + \\phi_{c} \\right)}}{2 R_{2}} + \\frac{\\dot{\\phi}_a^{2} a^{2} \\left(\\frac{m_{a}}{3} + m_{b}\\right)}{2} + \\frac{\\dot{\\phi}_a \\dot{\\phi}_b a b m_{b} \\cos{\\left(\\phi_{a} - \\phi_{b} \\right)}}{2} + \\frac{\\dot{\\phi}_b^{2} b^{2} m_{b}}{6} + \\frac{\\dot{\\phi}_c^{2} c^{2} m_{c}}{6} + \\dot{\\theta}_1^{2} \\left(\\frac{L_{1}^{2} m_{1}}{6} + \\frac{L_{1}^{2} \\left(m_{a} + m_{b}\\right)}{2} + \\frac{L_{2}^{2} R_{1}^{2} \\left(\\frac{m_{2}}{3} + m_{c}\\right)}{2 R_{2}^{2}}\\right) - g \\left(L_{1} \\left(\\frac{m_{1}}{2} + m_{a} + m_{b}\\right) \\sin{\\left(\\theta_{1} \\right)} - L_{2} \\left(\\frac{m_{2}}{2} + m_{c}\\right) \\sin{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} \\right)} + a \\left(\\frac{m_{a}}{2} + m_{b}\\right) \\sin{\\left(\\phi_{a} \\right)} + \\frac{b m_{b} \\sin{\\left(\\phi_{b} \\right)}}{2} + \\frac{c m_{c} \\sin{\\left(\\phi_{c} \\right)}}{2}\\right)";

const EOM_TEX = "\\left[\\begin{matrix}\\frac{\\frac{L_{1}^{2} R_{2}^{2} \\left(m_{1} + 3 m_{a} + 3 m_{b}\\right)}{3} + \\frac{L_{2}^{2} R_{1}^{2} m_{2}}{3} + L_{2}^{2} R_{1}^{2} m_{c}}{R_{2}^{2}} & \\frac{L_{1} a \\left(m_{a} + 2 m_{b}\\right) \\cos{\\left(\\phi_{a} - \\theta_{1} \\right)}}{2} & \\frac{L_{1} b m_{b} \\cos{\\left(\\phi_{b} - \\theta_{1} \\right)}}{2} & - \\frac{L_{2} R_{1} c m_{c} \\cos{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} + \\phi_{c} \\right)}}{2 R_{2}}\\\\\\frac{L_{1} a \\left(m_{a} + 2 m_{b}\\right) \\cos{\\left(\\phi_{a} - \\theta_{1} \\right)}}{2} & a^{2} \\left(\\frac{m_{a}}{3} + m_{b}\\right) & \\frac{a b m_{b} \\cos{\\left(\\phi_{a} - \\phi_{b} \\right)}}{2} & 0\\\\\\frac{L_{1} b m_{b} \\cos{\\left(\\phi_{b} - \\theta_{1} \\right)}}{2} & \\frac{a b m_{b} \\cos{\\left(\\phi_{a} - \\phi_{b} \\right)}}{2} & \\frac{b^{2} m_{b}}{3} & 0\\\\- \\frac{L_{2} R_{1} c m_{c} \\cos{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} + \\phi_{c} \\right)}}{2 R_{2}} & 0 & 0 & \\frac{c^{2} m_{c}}{3}\\end{matrix}\\right]\\begin{bmatrix}\\ddot{\\theta}_1\\\\\\ddot{\\phi}_a\\\\\\ddot{\\phi}_b\\\\\\ddot{\\phi}_c\\end{bmatrix} = \\left[\\begin{matrix}\\frac{L_{1} \\dot{\\phi}_a^{2} a m_{a} \\sin{\\left(\\phi_{a} - \\theta_{1} \\right)}}{2} + L_{1} \\dot{\\phi}_a^{2} a m_{b} \\sin{\\left(\\phi_{a} - \\theta_{1} \\right)} + \\frac{L_{1} \\dot{\\phi}_b^{2} b m_{b} \\sin{\\left(\\phi_{b} - \\theta_{1} \\right)}}{2} - \\frac{L_{1} g m_{1} \\cos{\\left(\\theta_{1} \\right)}}{2} - L_{1} g m_{a} \\cos{\\left(\\theta_{1} \\right)} - L_{1} g m_{b} \\cos{\\left(\\theta_{1} \\right)} - \\frac{L_{2} R_{1} \\dot{\\phi}_c^{2} c m_{c} \\sin{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} + \\phi_{c} \\right)}}{2 R_{2}} + \\frac{L_{2} R_{1} g m_{2} \\cos{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} \\right)}}{2 R_{2}} + \\frac{L_{2} R_{1} g m_{c} \\cos{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} \\right)}}{R_{2}}\\\\- \\frac{a \\left(L_{1} \\dot{\\theta}_1^{2} m_{a} \\sin{\\left(\\phi_{a} - \\theta_{1} \\right)} + 2 L_{1} \\dot{\\theta}_1^{2} m_{b} \\sin{\\left(\\phi_{a} - \\theta_{1} \\right)} + \\dot{\\phi}_b^{2} b m_{b} \\sin{\\left(\\phi_{a} - \\phi_{b} \\right)} + g m_{a} \\cos{\\left(\\phi_{a} \\right)} + 2 g m_{b} \\cos{\\left(\\phi_{a} \\right)}\\right)}{2}\\\\\\frac{b m_{b} \\left(- L_{1} \\dot{\\theta}_1^{2} \\sin{\\left(\\phi_{b} - \\theta_{1} \\right)} + \\dot{\\phi}_a^{2} a \\sin{\\left(\\phi_{a} - \\phi_{b} \\right)} - g \\cos{\\left(\\phi_{b} \\right)}\\right)}{2}\\\\- \\frac{c m_{c} \\left(L_{2} R_{1}^{2} \\dot{\\theta}_1^{2} \\sin{\\left(\\frac{R_{1} \\theta_{1}}{R_{2}} + \\phi_{c} \\right)} + R_{2}^{2} g \\cos{\\left(\\phi_{c} \\right)}\\right)}{2 R_{2}^{2}}\\end{matrix}\\right]";

function typeset(){
  if(typeof katex==='undefined'){ setTimeout(typeset,120); return; }
  const R = String.raw;
  const put=(id,tex,disp)=>{
    const el=document.getElementById(id); if(!el) return;
    try{ katex.render(tex, el, {displayMode:disp!==false, throwOnError:false}); }
    catch(err){ el.innerHTML='<span class="raweq">'+tex+'</span>'; }
  };

  // inline bits
  put('k-nhat', R`\hat n_2`, false);
  put('k-grav', R`-g\,\hat n_2`, false);
  put('k-dir',  R`\hat e(\psi)=\cos\psi\,\hat n_1+\sin\psi\,\hat n_2`, false);
  put('k-rho',  R`\rho=R_1/R_2`, false);
  put('e-bdef', R`\theta_2=-\rho\theta_1,\ \rho=R_1/R_2`, false);
  put('el-op',  R`\frac{d}{dt}\!\left(\frac{\partial\mathcal L}{\partial \dot q}\right)-\frac{\partial\mathcal L}{\partial q}=0`, false);
  put('el-mf',  R`M(q)\,\ddot q=F(q,\dot q)`, false);
  put('s-solve',R`\ddot q=M(q)^{-1}F(q,\dot q)`, false);

  // kinematics
  put('k-pos', R`\begin{aligned}
      &\mathbf r_{A_1}=L_1\,\hat e(\theta_1),\quad
        \mathbf r_{A_2}=\mathbf r_{A_1}+a\,\hat e(\phi_a),\quad
        \mathbf r_{B_1}=L_2\,\hat e(\theta_2),\\[3pt]
      &\mathbf r_{G_1}=\tfrac{L_1}{2}\hat e(\theta_1),\ \
        \mathbf r_{G_a}=\mathbf r_{A_1}+\tfrac a2\hat e(\phi_a),\ \
        \mathbf r_{G_b}=\mathbf r_{A_2}+\tfrac b2\hat e(\phi_b),\ \
        \mathbf r_{G_2}=\tfrac{L_2}{2}\hat e(\theta_2),\ \
        \mathbf r_{G_c}=\mathbf r_{B_1}+\tfrac c2\hat e(\phi_c)
      \end{aligned}`);
  put('k-con', R`\underbrace{R_1\,\theta_1=-R_2\,\theta_2}_{\text{external spur-gear mesh}}
      \ \Longrightarrow\ \theta_2=-\rho\,\theta_1,\quad \dot\theta_2=-\rho\,\dot\theta_1,
      \qquad \rho=\frac{R_1}{R_2}.`);
  put('k-vel', R`\begin{aligned}
      v_{G_1}^2&=\tfrac{L_1^2}{4}\dot\theta_1^2,\qquad
      v_{G_2}^2=\tfrac{L_2^2}{4}\rho^2\dot\theta_1^2,\\[2pt]
      v_{G_a}^2&=L_1^2\dot\theta_1^2+\tfrac{a^2}{4}\dot\phi_a^2
                +L_1 a\,\dot\theta_1\dot\phi_a\cos(\theta_1-\phi_a),\\[2pt]
      v_{G_b}^2&=L_1^2\dot\theta_1^2+a^2\dot\phi_a^2+\tfrac{b^2}{4}\dot\phi_b^2
                +2L_1 a\,\dot\theta_1\dot\phi_a\cos(\theta_1-\phi_a)\\
              &\quad+L_1 b\,\dot\theta_1\dot\phi_b\cos(\theta_1-\phi_b)
                +a b\,\dot\phi_a\dot\phi_b\cos(\phi_a-\phi_b),\\[2pt]
      v_{G_c}^2&=L_2^2\rho^2\dot\theta_1^2+\tfrac{c^2}{4}\dot\phi_c^2
                -L_2 c\,\rho\,\dot\theta_1\dot\phi_c\cos(\rho\theta_1+\phi_c)
      \end{aligned}`);

  // energies
  put('e-T', R`\begin{aligned}T&=\tfrac12\!\sum_{\text{bodies}}\!\big(m\,|\mathbf v_G|^2+I_G\,\omega^2\big)
      =\tfrac12\,\dot q^{\mathsf T}M(q)\,\dot q,\\ &\quad I_G=\tfrac{1}{12}m\,\ell^2\ (\text{uniform rod})\end{aligned}`);
  put('e-V', R`\begin{aligned}V=g\Big[&L_1\big(\tfrac{m_1}{2}{+}m_a{+}m_b\big)\sin\theta_1
      +a\big(\tfrac{m_a}{2}{+}m_b\big)\sin\phi_a+\tfrac{m_b b}{2}\sin\phi_b\\
      &-L_2\big(\tfrac{m_2}{2}{+}m_c\big)\sin(\rho\theta_1)+\tfrac{m_c c}{2}\sin\phi_c\Big]\end{aligned}`);
  put('e-L', LAG_TEX);

  // Euler-Lagrange / canonical form (verified)
  put('s-eom', EOM_TEX);

  // first-order state form
  put('s-state', R`\frac{d}{dt}\big[\theta_1,\phi_a,\phi_b,\phi_c,\
      \dot\theta_1,\dot\phi_a,\dot\phi_b,\dot\phi_c\big]^{\mathsf T}
      =\big[\dot\theta_1,\dot\phi_a,\dot\phi_b,\dot\phi_c,\
      \ddot\theta_1,\ddot\phi_a,\ddot\phi_b,\ddot\phi_c\big]^{\mathsf T},\qquad
      \ddot q=M(q)^{-1}F(q,\dot q)`);

  // conserved / constrained quantities
  put('c-E',    R`E=T+V=\text{const}`);
  put('c-gear', R`R_1\theta_1+R_2\theta_2=0=\text{const (gear mesh)}`);
}

/* ---------- go ---------- */
resetState();
requestAnimationFrame(frame);
</script>
